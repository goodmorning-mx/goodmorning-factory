name: Report Factory stage to Software portal
description: Send an authenticated operation stage event to the Software Factory API.
inputs:
  operation-id:
    description: Durable Software Factory operation identifier.
    required: true
  product-slug:
    description: Product repository slug.
    required: true
  stage:
    description: Factory stage name accepted by the portal.
    required: true
  status:
    description: queued, in_progress, success, failure, cancelled, blocked, or unknown.
    required: true
  title:
    description: Customer-facing short stage title.
    required: true
  summary:
    description: Customer-facing short stage summary.
    required: true
  pull-request-number:
    description: Optional pull request number for a code change.
    required: false
    default: ''
  source-sha:
    description: Optional repository source commit SHA.
    required: false
    default: ''
  repository-id:
    description: GitHub numeric repository id reported after private repository creation.
    required: false
    default: ''
  portal-environment:
    description: Software portal database receiving this Factory operation event.
    required: false
    default: dev
  environment:
    description: Product runtime environment (dev or production) being verified.
    required: false
    default: ''
  desired-sha:
    description: Expected source SHA for the product runtime.
    required: false
    default: ''
  observed-sha:
    description: Source SHA observed from the product runtime.
    required: false
    default: ''
  deployment-id:
    description: Optional Coolify deployment identifier.
    required: false
    default: ''
  environment-url:
    description: Public URL of the product environment being verified.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        OPERATION_ID: ${{ inputs.operation-id }}
        PRODUCT_SLUG: ${{ inputs.product-slug }}
        FACTORY_STAGE: ${{ inputs.stage }}
        FACTORY_STATUS: ${{ inputs.status }}
        FACTORY_TITLE: ${{ inputs.title }}
        FACTORY_SUMMARY: ${{ inputs.summary }}
        FACTORY_PR_NUMBER: ${{ inputs.pull-request-number }}
        FACTORY_SOURCE_SHA: ${{ inputs.source-sha }}
        FACTORY_REPOSITORY_ID: ${{ inputs.repository-id }}
        PORTAL_ENVIRONMENT: ${{ inputs.portal-environment }}
        PRODUCT_ENVIRONMENT: ${{ inputs.environment }}
        FACTORY_DESIRED_SHA: ${{ inputs.desired-sha }}
        FACTORY_OBSERVED_SHA: ${{ inputs.observed-sha }}
        FACTORY_DEPLOYMENT_ID: ${{ inputs.deployment-id }}
        PRODUCT_ENVIRONMENT_URL: ${{ inputs.environment-url }}
      with:
        github-token: ${{ github.token }}
        script: |
          const token = await core.getIDToken('software.goodmorning.mx');
          core.setSecret(token);
          const portalUrls = {
            dev: 'https://api.dev.software.goodmorning.mx',
            production: 'https://api.software.goodmorning.mx',
          };
          const portalUrl = portalUrls[process.env.PORTAL_ENVIRONMENT];
          if (!portalUrl) {
            throw new Error('Unsupported Software portal environment.');
          }
          const response = await fetch(`${portalUrl}/internal/factory/events`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${token}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              event_id: `${context.runId}:${process.env.FACTORY_STAGE}:${process.env.FACTORY_STATUS}`,
              event_type: 'factory.product.stage',
              product_slug: process.env.PRODUCT_SLUG,
              operation_id: process.env.OPERATION_ID,
              stage: process.env.FACTORY_STAGE,
              status: process.env.FACTORY_STATUS,
              title: process.env.FACTORY_TITLE,
              summary: process.env.FACTORY_SUMMARY,
              pull_request_number: process.env.FACTORY_PR_NUMBER ? Number(process.env.FACTORY_PR_NUMBER) : undefined,
              source_sha: process.env.FACTORY_SOURCE_SHA || undefined,
              environment: process.env.PRODUCT_ENVIRONMENT || undefined,
              desired_sha: process.env.FACTORY_DESIRED_SHA || undefined,
              observed_sha: process.env.FACTORY_OBSERVED_SHA || undefined,
              deployment_id: process.env.FACTORY_DEPLOYMENT_ID || undefined,
              environment_url: process.env.PRODUCT_ENVIRONMENT_URL || undefined,
              repository_id: /^\d+$/.test(process.env.FACTORY_REPOSITORY_ID || '') ? Number(process.env.FACTORY_REPOSITORY_ID) : undefined,
              workflow_run_id: context.runId,
              url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            }),
          });
          if (!response.ok) {
            throw new Error(`Portal event ingestion failed with HTTP ${response.status}.`);
          }
