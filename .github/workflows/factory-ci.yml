name: GoodMorning Factory CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  factory-ci:
    name: Validate factory provisioning code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: python -m py_compile scripts/create_product.py scripts/provision_coolify_development.py scripts/provision_product_development.py tests/test_create_product.py tests/test_provision_coolify_development.py tests/test_provision_product_development.py tests/test_verify_coolify_workflow.py

      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify expected provisioning files exist
        run: |
          set -euo pipefail
          test -f .github/workflows/create-product.yml
          test -f scripts/create_product.py
          test -f tests/test_create_product.py
          test -f docs/product-provisioning.md
          test -f .github/workflows/provision-coolify-development.yml
          test -f scripts/provision_coolify_development.py
          test -f tests/test_provision_coolify_development.py
          test -f scripts/provision_product_development.py
          test -f tests/test_provision_product_development.py
          test -f docs/coolify-development-provisioning.md


      - name: Verify Coolify Compose defaults do not publish host ports
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          compose = Path('compose.yaml').read_text()
          if '\n    ports:' in compose or '\nports:' in compose:
              raise SystemExit('compose.yaml must not publish host ports; Coolify owns public ingress.')
          expected_services = {
              'frontend': {
                  'expose': '      - "80"',
                  'health': 'http://127.0.0.1/',
                  'routing': 'traefik.http.services.frontend.loadbalancer.server.port=80',
              },
              'backend': {
                  'expose': '      - "8000"',
                  'health': 'http://127.0.0.1:8000/health',
                  'routing': 'traefik.http.services.backend.loadbalancer.server.port=8000',
              },
          }
          service_markers = [
              (line.strip()[:-1], index)
              for index, line in enumerate(compose.splitlines())
              if line.startswith('  ') and not line.startswith('    ') and line.strip().endswith(':')
          ]
          lines = compose.splitlines()
          for service, expected in expected_services.items():
              starts = [index for name, index in service_markers if name == service]
              if not starts:
                  raise SystemExit(f'missing {service} service in compose.yaml')
              start = starts[0]
              following = [index for _name, index in service_markers if index > start]
              end = min(following) if following else len(lines)
              service_block = '\n'.join(lines[start:end])
              if expected['expose'] not in service_block:
                  raise SystemExit(f'{service} must use expose for its internal port: {expected["expose"].strip()}')
              if 'healthcheck:' not in service_block:
                  raise SystemExit(f'{service} must define a container healthcheck in compose.yaml')
              if expected['health'] not in service_block:
                  raise SystemExit(f'{service} healthcheck must target {expected["health"]}')
              if expected['routing'] not in service_block:
                  raise SystemExit(f'{service} must define an explicit Traefik internal routing port label.')
          print('compose.yaml avoids host port publishing and defines frontend/backend healthchecks.')
          PY

      - name: Verify no destructive GitHub repository operations are implemented
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/create_product.py').read_text()
          forbidden = {
              'DELETE /repos': ['DELETE /repos', 'request("DELETE"', "request('DELETE'"],
              'repository transfer endpoints': ['/transfer', 'transfer_repository'],
              'archive operations': ['archive', 'archived'],
              'public visibility changes': ['"visibility": "public"', "'visibility': 'public'", 'private": False', "private': False"],
          }
          failures = [label for label, needles in forbidden.items() if any(needle in text for needle in needles)]
          if failures:
              raise SystemExit('Forbidden operation markers found: ' + ', '.join(failures))
          print('No destructive repository operation markers found.')
          PY

      - name: Verify no credential-like files or private keys are committed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          forbidden_file_names = {
              '.env', '.env.local', '.env.production', 'id_rsa', 'id_dsa',
              'id_ecdsa', 'id_ed25519', 'credentials.json', 'service-account.json',
          }
          private_key = re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----')
          token = re.compile(r'(ghp_|github_pat_|gho_|ghu_|ghs_|ghr_)[A-Za-z0-9_]{20,}')
          failures = []
          for path in Path('.').rglob('*'):
              if '.git' in path.parts or not path.is_file():
                  continue
              if path.name in forbidden_file_names or path.suffix in {'.pem', '.key', '.p12', '.pfx'}:
                  failures.append(f'credential-like file: {path}')
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if private_key.search(text):
                  failures.append(f'private key material: {path}')
              if token.search(text):
                  failures.append(f'GitHub token-like value: {path}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('No credential-like files, private keys, or GitHub token-like values found.')
          PY

      - name: Verify stage-5 provisioner has no process execution imports or calls
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('scripts/provision_product_development.py').read_text())
          forbidden_imports = {'subprocess', 'paramiko'}
          forbidden_calls = {
              ('os', 'system'),
              ('os', 'popen'),
              ('pty', 'spawn'),
          }
          failures = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      root = alias.name.split('.')[0]
                      if root in forbidden_imports:
                          failures.append(f'forbidden import: {alias.name}')
              elif isinstance(node, ast.ImportFrom):
                  root = (node.module or '').split('.')[0]
                  if root in forbidden_imports:
                      failures.append(f'forbidden import: {node.module}')
              elif isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  owner = node.func.value
                  if isinstance(owner, ast.Name) and (owner.id, node.func.attr) in forbidden_calls:
                      failures.append(f'forbidden process call: {owner.id}.{node.func.attr}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('No forbidden process execution imports or calls found in stage-5 provisioner.')
          PY

      - name: Verify stage-5 deployment endpoints remain forbidden
        run: |
          set -euo pipefail
          python - <<'PY'
          import scripts.provision_product_development as pp
          mode = pp.ExecutionMode('apply', 'ledger', 'ledger', True, True, 'ledger-postgres-dev', True, 'ledger-api-dev', True, 'ledger-api-dev')
          client = pp.CoolifyClient('https://coolify.example', 'unit-test-token', mode=mode)
          for method, path, kind in (
              ('POST', '/applications/app/start', 'postgresql_start'),
              ('POST', '/databases/db/restart', 'postgresql_start'),
              ('POST', '/databases/db/stop', 'postgresql_start'),
              ('POST', '/databases/db/delete', 'postgresql_start'),
              ('POST', '/deploy', 'postgresql_start'),
              ('POST', '/deployments', 'postgresql_start'),
              ('POST', '/databases/db/start/extra', 'postgresql_start'),
              ('POST', '/databases//start', 'postgresql_start'),
              ('PATCH', '/databases/db', None),
              ('PUT', '/databases/db', None),
              ('DELETE', '/databases/db', None),
              ('POST', '/databases/db/start', 'postgresql_create'),
          ):
              try:
                  client._check_request(method, path, post_kind=kind)
              except pp.ProvisioningError as exc:
                  if exc.error_type != 'safety':
                      raise SystemExit(f'{method} {path} failed with non-safety error: {exc.error_type}')
                  continue
              raise SystemExit(f'{method} {path} was not blocked')
          client._check_request('POST', '/databases/db/start', post_kind='postgresql_start')
          print('Deployment, Application lifecycle, database restart/stop/delete endpoints are blocked by safety checks without network.')
          PY


      - name: Verify Stage 2-5 regression contract and documentation markers
        run: |
          set -euo pipefail
          python - <<'PY'
          import scripts.provision_product_development as pp
          stage5_posts = {'project_create', 'environment_create', 'postgresql_create', 'postgresql_start', 'backend_application_create', 'backend_env_create'}
          if not stage5_posts <= pp.ALLOWED_POST_KINDS:
              raise SystemExit(f'Stage 2-5 POST operations missing from allowlist: {stage5_posts - pp.ALLOWED_POST_KINDS}')
          if pp.WRITE_METHODS != {'POST', 'PATCH'}:
              raise SystemExit(f'WRITE_METHODS must classify POST and PATCH as mutations: {pp.WRITE_METHODS}')
          if pp.BACKEND_ENV_KEYS != {'DATABASE_URL', 'APP_ENV', 'CORS_ORIGINS'}:
              raise SystemExit(f'Unexpected backend env keys: {pp.BACKEND_ENV_KEYS}')
          required_app_fields = {'name', 'project_uuid', 'environment_uuid', 'environment_name', 'server_uuid', 'destination_uuid', 'github_app_uuid', 'git_repository', 'git_branch', 'build_pack', 'base_directory', 'dockerfile_location', 'ports_exposes', 'domains', 'instant_deploy', 'is_auto_deploy_enabled', 'autogenerate_domain', 'health_check_enabled', 'health_check_path', 'health_check_port', 'health_check_method', 'health_check_scheme', 'health_check_return_code'}
          if pp.APPROVED_BACKEND_APPLICATION_FIELDS != required_app_fields:
              raise SystemExit('Backend Application payload fields changed without updating CI contract')
          if pp.APPROVED_BACKEND_ENV_FIELDS != {'key', 'value', 'is_runtime', 'is_buildtime', 'is_preview', 'is_literal', 'is_multiline', 'is_shown_once'}:
              raise SystemExit('Backend env payload fields changed without updating CI contract')
          mode = pp.ExecutionMode('apply', 'ledger', 'ledger', True, True, 'ledger-postgres-dev', True, 'ledger-api-dev', True, 'ledger-api-dev')
          client = pp.CoolifyClient('https://coolify.example', 'unit-test-token', mode=mode)
          client.bind_backend_application_uuid('api-1', {'project_uuid':'project-1','environment_uuid':'env-1','server_uuid':'server-1','destination_uuid':'dest-1','github_app_uuid':'app-1','git_repository':'goodmorning-mx/ledger'})
          client.bind_backend_env_contract(pp.desired_backend_env('ledger', 'postgresql+psycopg://user:pass@host/db'))
          client._check_request('POST', '/databases/db-1/start', post_kind='postgresql_start')
          for bad in ['/databases/db-1/restart', '/databases/db-1/stop', '/databases/db-1/start/extra']:
              try:
                  client._check_request('POST', bad, post_kind='postgresql_start')
              except pp.ProvisioningError:
                  pass
              else:
                  raise SystemExit(f'forbidden database lifecycle path was allowed: {bad}')
          client.bind_backend_application_bindings({'project_uuid':'project-1','environment_uuid':'env-1','server_uuid':'server-1','destination_uuid':'dest-1','github_app_uuid':'app-1','git_repository':'goodmorning-mx/ledger'})
          app_payload = pp.backend_create_payload(type('Args', (), {'product':'ledger', 'repository':'goodmorning-mx/ledger'})(), client.backend_application_bindings)
          client._check_request('POST', '/applications/private-github-app', post_kind='backend_application_create', json_body=app_payload)
          client._check_request('POST', '/applications/api-1/envs', post_kind='backend_env_create', json_body={'key':'APP_ENV','value':'dev','is_runtime':True,'is_buildtime':False,'is_preview':False,'is_literal':True,'is_multiline':False})
          client._check_request('PATCH', '/applications/api-1/envs', post_kind='backend_env_update', json_body={'key':'APP_ENV','value':'dev','is_runtime':True,'is_buildtime':False,'is_preview':False,'is_literal':True,'is_multiline':False})
          try:
              client._check_request('POST', '/applications/other/envs', post_kind='backend_env_create', json_body={'key':'APP_ENV','value':'dev','is_runtime':True,'is_buildtime':False,'is_preview':False,'is_literal':True,'is_multiline':False})
          except pp.ProvisioningError:
              pass
          else:
              raise SystemExit('env write for non-bound backend UUID was allowed')
          for method, path in [('PATCH','/applications/api-1'), ('POST','/applications/api-1/envs/bulk'), ('POST','/applications/api-1/restart')]:
              try:
                  client._check_request(method, path, post_kind='backend_env_update' if method == 'PATCH' else 'backend_env_create', json_body={'key':'APP_ENV'})
              except pp.ProvisioningError:
                  pass
              else:
                  raise SystemExit(f'forbidden stage-5 path was allowed: {method} {path}')
          import re
          doc = __import__('pathlib').Path('docs/coolify-development-provisioning.md').read_text()
          normalized = re.sub(r'[`*]+', '', doc).lower()
          normalized = re.sub(r'\s+', ' ', normalized)
          checks = {
              'Stage 8 canonical': 'stage 8 is the current canonical development provisioning architecture' in normalized,
              'backend endpoint': 'post /api/v1/applications/private-github-app' in normalized,
              'env endpoints': 'patch /api/v1/applications/{uuid}/envs' in normalized,
              'internal_db_url secret handling': re.search(r'internal_db_url.{0,160}never|never.{0,160}internal_db_url', normalized) is not None,
              'frontend stage 6 implemented': 'frontend dockerfile application' in normalized and 'vite_api_url' in normalized,
              'backend uuid binding': 'binds a single verified backend application uuid' in normalized,
              'independent env reconciliation': 'app_env/cors' in normalized or 'app_env and cors_origins' in normalized,
          }
          failures = [name for name, ok in checks.items() if not ok]
          if failures:
              raise SystemExit('missing canonical documentation semantics: ' + ', '.join(failures))
          print('Stage 2-5 regression contract and documentation markers verified.')
          PY


      - name: Verify Stage 6 canonical allowlist and frontend contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          import scripts.provision_product_development as pp
          stage6_posts = {'project_create', 'environment_create', 'postgresql_create', 'postgresql_start', 'backend_application_create', 'backend_env_create', 'frontend_application_create', 'frontend_env_create'}
          expected_stage6_patches = {'backend_env_update', 'frontend_env_update'}
          if not stage6_posts <= pp.ALLOWED_POST_KINDS:
              raise SystemExit(f'Stage 2-6 POST allowlist subset mismatch: {pp.ALLOWED_POST_KINDS}')
          if pp.ALLOWED_PATCH_KINDS != expected_stage6_patches:
              raise SystemExit(f'Stage 6 canonical PATCH allowlist mismatch: {pp.ALLOWED_PATCH_KINDS}')
          expected_app = {'name', 'project_uuid', 'environment_uuid', 'environment_name', 'server_uuid', 'destination_uuid', 'github_app_uuid', 'git_repository', 'git_branch', 'build_pack', 'base_directory', 'dockerfile_location', 'ports_exposes', 'domains', 'instant_deploy', 'is_auto_deploy_enabled', 'autogenerate_domain', 'health_check_enabled', 'health_check_path', 'health_check_port', 'health_check_method', 'health_check_scheme', 'health_check_return_code'}
          if pp.APPROVED_FRONTEND_APPLICATION_FIELDS != expected_app:
              raise SystemExit('Frontend Application payload field allowlist changed')
          if pp.APPROVED_FRONTEND_ENV_FIELDS != {'key','value','is_runtime','is_buildtime','is_preview','is_literal','is_multiline'}:
              raise SystemExit('Frontend env payload field allowlist changed')
          payload = pp.frontend_create_payload(type('A', (), {'product':'ledger','repository':'goodmorning-mx/ledger'})(), {'project_uuid':'p','environment_uuid':'e','server_uuid':'s','destination_uuid':'d','github_app_uuid':'g','git_repository':'goodmorning-mx/ledger'})
          if payload['domains'] != 'https://dev.ledger.goodmorning.mx' or payload['ports_exposes'] != '80' or any(port in payload['domains'] for port in (':80',':3000',':8000')):
              raise SystemExit('Frontend domain/port contract broken')
          env = pp.desired_frontend_env('ledger','https://api.dev.ledger.goodmorning.mx')[0]
          if env['key'] != 'VITE_API_URL' or env['is_buildtime'] is not True or env['is_runtime'] is not False:
              raise SystemExit('VITE_API_URL build-time contract broken')
          mode = pp.ExecutionMode('apply','ledger','ledger',True,False,None,False,None,False,None,True,'ledger-frontend-dev',True,'ledger-frontend-dev')
          client = pp.CoolifyClient('https://coolify.example','unit-test-token',mode=mode)
          client.bind_backend_application_uuid('api-1', {})
          client.bind_frontend_application_uuid('front-1', {'git_repository':'goodmorning-mx/ledger','project_uuid':'p','environment_uuid':'e','server_uuid':'s','destination_uuid':'d','github_app_uuid':'g'})
          client.bind_frontend_env_contract([env])
          client._check_request('POST','/applications/private-github-app',post_kind='frontend_application_create',json_body=payload)
          client._check_request('POST','/applications/front-1/envs',post_kind='frontend_env_create',json_body=pp.frontend_env_payload(env))
          client._check_request('PATCH','/applications/front-1/envs',post_kind='frontend_env_update',json_body=pp.frontend_env_payload(env))
          for method,path,kind in [('PATCH','/applications/front-1','frontend_env_update'),('POST','/applications/front-1/start','frontend_env_create'),('POST','/deployments','frontend_env_create'),('DELETE','/applications/front-1',None),('PUT','/applications/front-1',None)]:
              try:
                  client._check_request(method,path,post_kind=kind,json_body=pp.frontend_env_payload(env))
              except pp.ProvisioningError:
                  pass
              else:
                  raise SystemExit(f'forbidden endpoint was allowed: {method} {path}')
          source = Path('scripts/provision_product_development.py').read_text()
          tree = ast.parse(source)
          names = [node.name for node in tree.body if isinstance(node, ast.FunctionDef)]
          if len(names) != len(set(names)):
              raise SystemExit('duplicate top-level functions detected')
          for forbidden in ('subprocess','paramiko','rsync','scp '):
              if forbidden in source:
                  raise SystemExit(f'forbidden remote execution marker: {forbidden}')
          print('Stage 6 frontend allowlist, payload, env, UUID isolation, post-write GET helpers, and lifecycle blocks verified.')
          PY


      - name: Verify Stage 7 backend deployment semantic contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          import scripts.provision_product_development as pp
          stage6_posts = {'project_create', 'environment_create', 'postgresql_create', 'postgresql_start', 'backend_application_create', 'backend_env_create', 'frontend_application_create', 'frontend_env_create'}
          stage7_posts = stage6_posts | {'backend_deploy'}
          if not stage7_posts <= pp.ALLOWED_POST_KINDS:
              raise SystemExit(f'Stage 7 POST allowlist subset mismatch: {pp.ALLOWED_POST_KINDS}')
          mode = pp.ExecutionMode('apply','ledger','ledger',True,deploy_backend=True,allow_deployments=True,allow_backend_deployment=True,confirm_backend_deployment='ledger-api-dev')
          client = pp.CoolifyClient('https://coolify.example','unit-test-token',mode=mode)
          client.bind_backend_application_uuid('api-1', {})
          client.bind_backend_deployment_preconditions(True)
          client._check_request('POST','/deploy',post_kind='backend_deploy',json_body={'uuid':'api-1','force':False})
          for body in ({'uuid':'api-1','force':True},{'uuid':'api-1,api-2','force':False},{'uuid':'api-2','force':False},{'uuid':'api-1','force':False,'tag':'x'}):
              try:
                  client._check_request('POST','/deploy',post_kind='backend_deploy',json_body=body)
              except pp.ProvisioningError:
                  pass
              else:
                  raise SystemExit(f'unsafe deploy body allowed: {body}')
          for method,path in [('GET','/deploy'),('POST','/applications/api-1/start'),('POST','/applications/api-1/restart'),('POST','/applications/api-1/stop'),('POST','/deployments/dep-1/cancel'),('POST','/applications/api-1/rollback')]:
              try:
                  client._check_request(method,path)
              except pp.ProvisioningError:
                  pass
              else:
                  raise SystemExit(f'forbidden lifecycle/deployment endpoint allowed: {method} {path}')
          if pp.DEPLOYMENT_OFFICIAL_STATUSES != {'queued','in_progress','finished','failed','cancelled-by-user'}:
              raise SystemExit('deployment status allowlist changed')
          if pp.RUNTIME_HEALTHY_STATUSES != {'running:healthy','healthy'}:
              raise SystemExit('runtime healthy status allowlist changed')
          flags = {'is_runtime': True, 'is_buildtime': False, 'is_preview': False, 'is_literal': True, 'is_multiline': False}
          rows = [{'key': key, 'status': 'exists', 'value_verified': True, 'desired_flags': flags} for key in ('DATABASE_URL','APP_ENV','CORS_ORIGINS')]
          ok, blockers = pp.backend_deployment_preflight(type('Args', (), {'product':'ledger'})(), {'name':'ledger-postgres-dev','status':'exists'}, {'status':'healthy','internal_db_url_available':True,'database_url_driver_ready':True}, {'name':'ledger-api-dev','status':'exists','uuid':'api-1'}, {'status':'exists','variables': rows}, [])
          if not ok or blockers:
              raise SystemExit(f'valid backend env preflight blocked: {blockers}')
          bad_ok, _ = pp.backend_deployment_preflight(type('Args', (), {'product':'ledger'})(), {'name':'ledger-postgres-dev','status':'exists'}, {'status':'healthy','internal_db_url_available':True,'database_url_driver_ready':True}, {'name':'ledger-api-dev','status':'exists','uuid':'api-1'}, {'status':'exists','variables': []}, [])
          if bad_ok:
              raise SystemExit('empty backend env preflight was allowed')
          for bad_history in ({}, {'count':0}, {'count':'0','deployments':[]}, {'count':0,'deployments':['bad']}):
              try:
                  pp.deployment_history(type('C', (), {'get': lambda self, path, value=bad_history: value})(), 'api-1')
              except pp.ProvisioningError:
                  pass
              else:
                  raise SystemExit(f'invalid history was accepted: {bad_history}')
          if pp.recover_new_deployment_candidates(set(), [{'deployment_uuid':'dep','resource_uuid':'api-1'}], 'api-1') != ['dep']:
              raise SystemExit('single backend recovery candidate was not accepted')
          if pp.recover_new_deployment_candidates(set(), [{'deployment_uuid':'dep','resource_uuid':'other'}], 'api-1'):
              raise SystemExit('contradictory recovery candidate was accepted')
          class A: product='ledger'; backend_deployment_timeout=1.0; backend_deployment_interval=0.1; backend_deployment_max_poll_errors=1; backend_runtime_timeout=1.0; backend_runtime_interval=0.1; backend_runtime_max_poll_errors=1; backend_smoke_timeout=1.0; backend_smoke_interval=0.1; backend_smoke_request_timeout=0.5; frontend_deployment_timeout=1.0; frontend_deployment_interval=0.1; frontend_deployment_max_poll_errors=1; frontend_runtime_timeout=1.0; frontend_runtime_interval=0.1; frontend_runtime_max_poll_errors=1; frontend_smoke_timeout=1.0; frontend_smoke_interval=0.1; frontend_smoke_request_timeout=0.5
          pp.validate_stage7_timing_args(A)
          pp.validate_backend_smoke_url('https://api.dev.ledger.goodmorning.mx/health','ledger')
          runtime = pp.verify_backend_runtime(type('C', (), {'get': lambda self, path: {'uuid':'api-1','name':'ledger-api-dev','status':'running:healthy'}})(), A, 'api-1', sleeper=lambda seconds: None, clock=iter([0,0]).__next__)
          if not runtime.get('healthy'):
              raise SystemExit('runtime polling did not accept healthy status')
          for bad in ['http://api.dev.ledger.goodmorning.mx/health','https://api.dev.ledger.goodmorning.mx:8000/health','https://api.dev.ledger.goodmorning.mx/health?x=1','https://localhost/health']:
              try:
                  pp.validate_backend_smoke_url(bad,'ledger')
              except pp.ProvisioningError:
                  pass
              else:
                  raise SystemExit(f'bad smoke URL allowed: {bad}')
          source = Path('scripts/provision_product_development.py').read_text()
          forbidden = ['subprocess','paramiko','rsync','scp ','configuration_snapshot','configuration_diff']
          for marker in forbidden:
              if marker in source:
                  raise SystemExit(f'forbidden Stage 7 marker present: {marker}')
          tree = ast.parse(source)
          names = [node.name for node in tree.body if isinstance(node, ast.FunctionDef)]
          if len(names) != len(set(names)):
              raise SystemExit('duplicate top-level functions detected')
          print('Stage 7 backend deploy allowlist, gates, status allowlists, polling/smoke contracts, lifecycle blocks, and remote execution ban verified.')
          PY


      - name: Verify Stage 8 frontend deployment semantic contract
        run: |
          set -euo pipefail
          python - <<'PY'
