name: Verify Coolify connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-coolify-connection:
    name: Verify Coolify connection
    runs-on: ubuntu-latest
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_BASE_URL:-}" ]; then
            echo "COOLIFY_BASE_URL repository variable is required."
            exit 1
          fi

          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "COOLIFY_API_TOKEN repository secret is required."
            exit 1
          fi

          echo "::add-mask::${COOLIFY_API_TOKEN}"

      - name: Request Coolify teams endpoint
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::${COOLIFY_API_TOKEN}"

          base_url="${COOLIFY_BASE_URL%/}"
          endpoint="${base_url}/api/v1/teams"
          response_file="$(mktemp)"

          http_status="$({
            curl \
              --silent \
              --show-error \
              --location \
              --request GET \
              --connect-timeout 10 \
              --max-time 30 \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "${endpoint}"
          } 2>&1)" || {
            rm -f "${response_file}"
            echo "Coolify connection check failed: unable to connect to the configured Coolify API."
            exit 1
          }

          rm -f "${response_file}"

          case "${http_status}" in
            2*)
              echo "Coolify connection verified against /api/v1/teams."
              ;;
            401)
              echo "Coolify connection check failed: HTTP 401 Unauthorized. Verify COOLIFY_API_TOKEN."
              exit 1
              ;;
            403)
              echo "Coolify connection check failed: HTTP 403 Forbidden. Verify token permissions for /api/v1/teams."
              exit 1
              ;;
            000)
              echo "Coolify connection check failed: connection error while contacting the configured Coolify API."
              exit 1
              ;;
            *)
              echo "Coolify connection check failed: unexpected HTTP status ${http_status}."
              exit 1
              ;;
          esac
