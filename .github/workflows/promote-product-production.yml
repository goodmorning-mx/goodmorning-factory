name: Promote one GoodMorning product to production

on:
  repository_dispatch:
    types:
      - promote-product
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Exact production/<product>.json resources-v3-production manifest.
        required: true
        type: string
      confirmation:
        description: Type deploy:<product>:production exactly.
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: goodmorning-factory-production-${{ github.event.client_payload.product || inputs.manifest_path }}
  cancel-in-progress: false

jobs:
  reconcile-production:
    name: Reconcile one production product
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_SERVER_NAME: ${{ vars.COOLIFY_SERVER_NAME || 'localhost' }}
      COOLIFY_DESTINATION_UUID: ${{ vars.COOLIFY_RESOURCES_DESTINATION_UUID || 'g61slcctgnbvhhc8si0h9tf0' }}
      COOLIFY_GITHUB_APP_NAME: ${{ vars.COOLIFY_GITHUB_APP_NAME || 'goodmorning-mx-coolify' }}
      COOLIFY_ALLOW_REAL_DEPLOYMENT: ${{ vars.COOLIFY_ALLOW_REAL_DEPLOYMENT }}
      OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
      OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
      OCI_S3_BUCKET: ${{ vars.OCI_S3_BUCKET }}
      OCI_S3_REGION: ${{ vars.OCI_S3_REGION }}
      OCI_S3_ENDPOINT: ${{ vars.OCI_S3_ENDPOINT }}
    steps:
      - name: Check out reviewed Factory dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Create source verification token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GOODMORNING_FACTORY_APP_ID }}
          private-key: ${{ secrets.GOODMORNING_FACTORY_PRIVATE_KEY }}
          owner: goodmorning-mx

      - name: Validate production release authorization
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REQUESTED_MANIFEST: ${{ inputs.manifest_path }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_PRODUCT: ${{ github.event.client_payload.product }}
          EVENT_REPOSITORY: ${{ github.event.client_payload.repository }}
          EVENT_SOURCE_BRANCH: ${{ github.event.client_payload.source_branch }}
          EVENT_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          EVENT_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"

          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            product="${EVENT_PRODUCT}"
            repository="${EVENT_REPOSITORY}"
            source_branch="${EVENT_SOURCE_BRANCH}"
            source_sha="${EVENT_SOURCE_SHA}"
            source_run_id="${EVENT_SOURCE_RUN_ID}"
            manifest="production/${product}.json"
            [[ "${source_run_id}" =~ ^[0-9]+$ ]]
          else
            manifest="${REQUESTED_MANIFEST}"
            [[ "${manifest}" =~ ^production/[a-z0-9][a-z0-9-]*\.json$ ]]
            test -f "${manifest}"
            product="$(jq -er '.product' "${manifest}")"
            repository="$(jq -er '.repository' "${manifest}")"
            source_branch="$(jq -er '.branch' "${manifest}")"
            source_sha="$(gh api "/repos/${repository}/branches/${source_branch}" --jq '.commit.sha')"
            test "${REQUESTED_CONFIRMATION}" = "deploy:${product}:production"
          fi

          [[ "${product}" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          test "${repository}" = "goodmorning-mx/${product}"
          test "${source_branch}" = "main"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          test -f "${manifest}"
          test "$(jq -r '.topology' "${manifest}")" = "resources-v3-production"
          test "$(jq -r '.product' "${manifest}")" = "${product}"
          test "$(jq -r '.repository' "${manifest}")" = "${repository}"
          test "$(jq -r '.branch' "${manifest}")" = "${source_branch}"
          test "$(jq -r '.confirm_production // false' "${manifest}")" = "true"

          current_sha="$(gh api "/repos/${repository}/branches/${source_branch}" --jq '.commit.sha')"
          test "${current_sha}" = "${source_sha}"

          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            test "$(jq -r '.promotion_policy // empty' "${manifest}")" = "auto-on-main"
            run_json="$(gh api "/repos/${repository}/actions/runs/${source_run_id}")"
            test "$(jq -r '.name' <<<"${run_json}")" = "CI"
            test "$(jq -r '.event' <<<"${run_json}")" = "push"
            test "$(jq -r '.conclusion' <<<"${run_json}")" = "success"
            test "$(jq -r '.head_branch' <<<"${run_json}")" = "main"
            test "$(jq -r '.head_sha' <<<"${run_json}")" = "${source_sha}"
          fi

          test -n "${COOLIFY_BASE_URL:-}"
          test -n "${COOLIFY_API_TOKEN:-}"
          test "${COOLIFY_ALLOW_REAL_DEPLOYMENT:-}" = "true"
          echo "::add-mask::${COOLIFY_API_TOKEN}"
          {
            echo "manifest=${manifest}"
            echo "product=${product}"
            echo "repository=${repository}"
            echo "source_sha=${source_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Plan production changes read-only
        shell: bash
        env:
          COOLIFY_ALLOW_RESOURCE_WRITES: 'false'
          COOLIFY_ALLOW_DATABASE_START: 'false'
          COOLIFY_ALLOW_BACKEND_APPLICATION_WRITES: 'false'
          COOLIFY_ALLOW_BACKEND_ENV_WRITES: 'false'
          COOLIFY_ALLOW_FRONTEND_APPLICATION_WRITES: 'false'
          COOLIFY_ALLOW_FRONTEND_ENV_WRITES: 'false'
          COOLIFY_ALLOW_DEPLOYMENTS: 'false'
          COOLIFY_ALLOW_BACKEND_DEPLOYMENT: 'false'
          COOLIFY_ALLOW_FRONTEND_DEPLOYMENT: 'false'
        run: |
          python -m scripts.reconcile_resources \
            --manifest "${{ steps.authorize.outputs.manifest }}" \
            --phase plan --operation plan \
            --server "${COOLIFY_SERVER_NAME}" \
            --github-app "${COOLIFY_GITHUB_APP_NAME}" \
            --destination-uuid "${COOLIFY_DESTINATION_UUID}"

      - name: Provision isolated production resources
        shell: bash
        env:
          COOLIFY_ALLOW_RESOURCE_WRITES: 'true'
          COOLIFY_ALLOW_DATABASE_START: 'true'
          COOLIFY_ALLOW_BACKEND_APPLICATION_WRITES: 'true'
          COOLIFY_ALLOW_BACKEND_ENV_WRITES: 'true'
          COOLIFY_ALLOW_FRONTEND_APPLICATION_WRITES: 'true'
          COOLIFY_ALLOW_FRONTEND_ENV_WRITES: 'true'
          # Provisioning creates/reconciles resources only. Deployment gates stay
          # closed here and are opened exclusively by the deploy-full step below.
          COOLIFY_ALLOW_DEPLOYMENTS: 'false'
          COOLIFY_ALLOW_BACKEND_DEPLOYMENT: 'false'
          COOLIFY_ALLOW_FRONTEND_DEPLOYMENT: 'false'
          COOLIFY_ALLOW_ADVANCED_PRODUCTION_WRITES: 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            set +e
            python -m scripts.reconcile_resources \
              --manifest "${{ steps.authorize.outputs.manifest }}" \
              --phase apply --operation provision \
              --server "${COOLIFY_SERVER_NAME}" \
              --github-app "${COOLIFY_GITHUB_APP_NAME}" \
              --destination-uuid "${COOLIFY_DESTINATION_UUID}"
            code=$?
            set -e
            [ "${code}" -eq 0 ] && exit 0
            [ "${attempt}" -eq 6 ] || sleep $((20 * attempt))
          done
          exit 1

      - name: Verify pre-deployment production backup
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${OCI_S3_ACCESS_KEY}"
          echo "::add-mask::${OCI_S3_SECRET_KEY}"
          python scripts/reconcile_database_backups.py \
            --manifest "${{ steps.authorize.outputs.manifest }}" \
            --backup-now true

      - name: Deploy API then frontend
        shell: bash
        env:
          COOLIFY_ALLOW_RESOURCE_WRITES: 'true'
          COOLIFY_ALLOW_DATABASE_START: 'true'
          COOLIFY_ALLOW_BACKEND_APPLICATION_WRITES: 'true'
          COOLIFY_ALLOW_BACKEND_ENV_WRITES: 'true'
          COOLIFY_ALLOW_FRONTEND_APPLICATION_WRITES: 'true'
          COOLIFY_ALLOW_FRONTEND_ENV_WRITES: 'true'
          COOLIFY_ALLOW_DEPLOYMENTS: 'true'
          COOLIFY_ALLOW_BACKEND_DEPLOYMENT: 'true'
          COOLIFY_ALLOW_FRONTEND_DEPLOYMENT: 'true'
          COOLIFY_ALLOW_ADVANCED_PRODUCTION_WRITES: 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            set +e
            python -m scripts.reconcile_resources \
              --manifest "${{ steps.authorize.outputs.manifest }}" \
              --phase apply --operation deploy-full \
              --server "${COOLIFY_SERVER_NAME}" \
              --github-app "${COOLIFY_GITHUB_APP_NAME}" \
              --destination-uuid "${COOLIFY_DESTINATION_UUID}"
            code=$?
            set -e
            [ "${code}" -eq 0 ] && exit 0
            [ "${attempt}" -eq 6 ] || sleep $((20 * attempt))
          done
          exit 1

      - name: Verify post-deployment production backup
        shell: bash
        run: |
          python scripts/reconcile_database_backups.py \
            --manifest "${{ steps.authorize.outputs.manifest }}" \
            --backup-now true

      - name: Publish production summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Production promotion verified"
            echo
            echo "- Product: \`${{ steps.authorize.outputs.product }}\`"
            echo "- Frontend: https://${{ steps.authorize.outputs.product }}.goodmorning.mx"
            echo "- API: https://api.${{ steps.authorize.outputs.product }}.goodmorning.mx/health"
            echo "- Source branch: \`main\`"
            echo "- Backups: pre-deployment and post-deployment verified"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report sanitized production failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[automation] GoodMorning production reconciliation failed"
          body="Production reconciliation failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
