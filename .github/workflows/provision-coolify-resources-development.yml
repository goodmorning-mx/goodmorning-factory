name: Provision Coolify resource-based development products

on:
  push:
    branches:
      - dev
    paths:
      - 'products/*.json'
      - 'scripts/provision_product_development.py'
      - 'scripts/reconcile_resource_product.py'
      - '.github/workflows/provision-coolify-resources-development.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: goodmorning-factory-resources-v2-dev
  cancel-in-progress: false

jobs:
  reconcile-resources-v2:
    name: Reconcile resources-v2 products
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_SERVER_NAME: ${{ vars.COOLIFY_SERVER_NAME || 'localhost' }}
      COOLIFY_DESTINATION_UUID: ${{ vars.COOLIFY_DESTINATION_UUID || 'bk8cw0gkswgo04o0s88sk0kg' }}
      COOLIFY_GITHUB_APP_NAME: ${{ vars.COOLIFY_GITHUB_APP_NAME || 'goodmorning-mx-coolify' }}
      COOLIFY_ALLOW_REAL_DEPLOYMENT: ${{ vars.COOLIFY_ALLOW_REAL_DEPLOYMENT }}
    steps:
      - name: Check out factory dev
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate development authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/dev" ]; then
            echo "resources-v2 reconciliation is restricted to Factory dev."
            exit 1
          fi
          if [ -z "${COOLIFY_BASE_URL:-}" ] || [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "COOLIFY_BASE_URL and COOLIFY_API_TOKEN are required."
            exit 1
          fi
          if [ "${COOLIFY_ALLOW_REAL_DEPLOYMENT:-}" != "true" ]; then
            echo "COOLIFY_ALLOW_REAL_DEPLOYMENT=true is required."
            exit 1
          fi
          echo "::add-mask::${COOLIFY_API_TOKEN}"

      - name: Plan all resources-v2 products
        shell: bash
        env:
          COOLIFY_ALLOW_RESOURCE_WRITES: 'false'
          COOLIFY_ALLOW_DATABASE_START: 'false'
          COOLIFY_ALLOW_BACKEND_APPLICATION_WRITES: 'false'
          COOLIFY_ALLOW_BACKEND_ENV_WRITES: 'false'
          COOLIFY_ALLOW_FRONTEND_APPLICATION_WRITES: 'false'
          COOLIFY_ALLOW_FRONTEND_ENV_WRITES: 'false'
          COOLIFY_ALLOW_DEPLOYMENTS: 'false'
          COOLIFY_ALLOW_BACKEND_DEPLOYMENT: 'false'
          COOLIFY_ALLOW_FRONTEND_DEPLOYMENT: 'false'
        run: |
          set -euo pipefail
          echo "::add-mask::${COOLIFY_API_TOKEN}"
          shopt -s nullglob
          selected=0
          for manifest in products/*.json; do
            if [ "$(jq -r '.topology // "compose-v1"' "${manifest}")" != "resources-v2" ]; then
              continue
            fi
            selected=$((selected + 1))
            python scripts/reconcile_resource_product.py \
              --manifest "${manifest}" \
              --phase plan \
              --operation deploy-full \
              --server "${COOLIFY_SERVER_NAME}" \
              --github-app "${COOLIFY_GITHUB_APP_NAME}" \
              --destination-uuid "${COOLIFY_DESTINATION_UUID}"
          done
          echo "Planned ${selected} resources-v2 product(s)."

      - name: Apply and deploy all resources-v2 products
        shell: bash
        env:
          COOLIFY_ALLOW_RESOURCE_WRITES: 'true'
          COOLIFY_ALLOW_DATABASE_START: 'true'
          COOLIFY_ALLOW_BACKEND_APPLICATION_WRITES: 'true'
          COOLIFY_ALLOW_BACKEND_ENV_WRITES: 'true'
          COOLIFY_ALLOW_FRONTEND_APPLICATION_WRITES: 'true'
          COOLIFY_ALLOW_FRONTEND_ENV_WRITES: 'true'
          COOLIFY_ALLOW_DEPLOYMENTS: 'true'
          COOLIFY_ALLOW_BACKEND_DEPLOYMENT: 'true'
          COOLIFY_ALLOW_FRONTEND_DEPLOYMENT: 'true'
        run: |
          set -euo pipefail
          echo "::add-mask::${COOLIFY_API_TOKEN}"
          status_file="${RUNNER_TEMP}/resources-v2-reconcile.log"
          : > "${status_file}"
          shopt -s nullglob
          selected=0
          for manifest in products/*.json; do
            if [ "$(jq -r '.topology // "compose-v1"' "${manifest}")" != "resources-v2" ]; then
              continue
            fi
            selected=$((selected + 1))
            product="$(jq -er '.product' "${manifest}")"
            echo "Reconciling resources-v2 product ${product}"
            python scripts/reconcile_resource_product.py \
              --manifest "${manifest}" \
              --phase apply \
              --operation deploy-full \
              --server "${COOLIFY_SERVER_NAME}" \
              --github-app "${COOLIFY_GITHUB_APP_NAME}" \
              --destination-uuid "${COOLIFY_DESTINATION_UUID}" 2>&1 | tee -a "${status_file}"
          done
          echo "Applied ${selected} resources-v2 product(s)."

      - name: Report sanitized resources-v2 failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/resources-v2-reconcile.log"
          issue_body="${RUNNER_TEMP}/resources-v2-issue.md"
          {
            echo "The automatic Coolify resources-v2 development reconciliation failed."
            echo
            echo "- Commit: ${{ github.sha }}"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```text'
            if [ -s "${status_file}" ]; then
              tail -n 200 "${status_file}"
            else
              echo "The workflow failed before the apply phase produced output."
            fi
            echo '```'
          } > "${issue_body}"
          title="[automation] Coolify resources-v2 development reconciliation failed"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file "${issue_body}"
          else
            gh issue create --title "${title}" --body-file "${issue_body}"
          fi
