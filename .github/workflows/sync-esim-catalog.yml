name: Sync eSIM RoamGo sandbox catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Refresh eSIM catalog
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - name: Validate required secret
        env:
          CATALOG_SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
        run: test -n "$CATALOG_SYNC_TOKEN"

      - name: Refresh catalog through the protected API
        env:
          CATALOG_SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/esim-catalog-sync.json"
          status="$(curl --fail-with-body --silent --show-error --max-time 180 \
            --output "${response_file}" --write-out '%{http_code}' \
            --request POST \
            --header "X-Sync-Token: ${CATALOG_SYNC_TOKEN}" \
            https://api.dev.esim.goodmorning.mx/catalog/sync)"
          test "${status}" = "200"
          python3 - <<'PY' "${response_file}"
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(json.dumps({
              "status": data.get("status"),
              "plans": data.get("plans"),
              "destinations": data.get("destinations"),
              "completed_at": data.get("completed_at"),
          }, sort_keys=True))
          PY
