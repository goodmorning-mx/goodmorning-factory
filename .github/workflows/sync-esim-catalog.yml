name: Sync eSIM RoamGo sandbox catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Refresh eSIM catalog
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - name: Validate required secret
        env:
          CATALOG_SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
        run: test -n "$CATALOG_SYNC_TOKEN"

      - name: Refresh catalog through the protected API
        env:
          CATALOG_SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/esim-catalog-sync.json"
          status="$(curl --silent --show-error --max-time 180 \
            --output "${response_file}" --write-out '%{http_code}' \
            --request POST \
            --header "X-Sync-Token: ${CATALOG_SYNC_TOKEN}" \
            https://api.dev.esim.goodmorning.mx/catalog/sync)"
          if [ "${status}" != "200" ]; then
            detail="$(jq -r '.detail // "catalog sync failed"' "${response_file}" 2>/dev/null || true)"
            echo "Catalog sync failed with HTTP ${status}: ${detail}"
            exit 1
          fi
          jq '{status, plans, destinations, completed_at}' "${response_file}"
