name: Provision Coolify development environment

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Keep true to only discover resources and print planned changes.'
        type: choice
        required: true
        default: 'true'
        options:
          - 'true'
          - 'false'
      product:
        description: 'GoodMorning product slug.'
        required: true
        default: factory-smoke-test
      repository:
        description: 'GitHub owner/repository.'
        required: true
        default: goodmorning-mx/factory-smoke-test
      branch:
        description: 'Git branch to deploy.'
        required: true
        default: dev
      compose:
        description: 'Docker Compose path in the repository.'
        required: true
        default: /compose.yaml
      domain:
        description: 'Development domain.'
        required: true
        default: dev.factory-smoke-test.goodmorning.mx
      coolify_github_app_name:
        description: 'Exact Coolify GitHub App source name.'
        required: true
        default: goodmorning-mx-coolify

permissions:
  contents: read

jobs:
  provision-coolify-development:
    name: Provision Coolify development environment
    runs-on: ubuntu-latest
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      DEVELOPMENT_DOMAIN: ${{ inputs.domain }}
      COOLIFY_SSH_HOST: ${{ vars.COOLIFY_SSH_HOST }}
      COOLIFY_SSH_USER: ${{ vars.COOLIFY_SSH_USER }}
      COOLIFY_SSH_PRIVATE_KEY: ${{ secrets.GOODMORNING_FACTORY_COOLIFY_SSH_KEY }}
      COOLIFY_SSH_KNOWN_HOSTS: ${{ secrets.GOODMORNING_FACTORY_COOLIFY_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate safety gates and configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_BASE_URL:-}" ]; then
            echo "COOLIFY_BASE_URL repository variable is required."
            exit 1
          fi

          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "COOLIFY_API_TOKEN repository secret is required."
            exit 1
          fi

          echo "::add-mask::${COOLIFY_API_TOKEN}"
          if [ -n "${COOLIFY_SSH_PRIVATE_KEY:-}" ]; then
            echo "::add-mask::${COOLIFY_SSH_PRIVATE_KEY}"
          fi
          if [ -n "${COOLIFY_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::add-mask::${COOLIFY_SSH_KNOWN_HOSTS}"
          fi

          if [ "${{ inputs.dry_run }}" = "false" ]; then
            if [ -z "${COOLIFY_SSH_HOST:-}" ] || [ -z "${COOLIFY_SSH_USER:-}" ] || [ -z "${COOLIFY_SSH_PRIVATE_KEY:-}" ] || [ -z "${COOLIFY_SSH_KNOWN_HOSTS:-}" ]; then
              echo "COOLIFY_SSH_HOST, COOLIFY_SSH_USER, COOLIFY_SSH_PRIVATE_KEY, and COOLIFY_SSH_KNOWN_HOSTS are required when dry_run=false."
              exit 1
            fi
          fi

          if [ "${{ inputs.branch }}" != "dev" ]; then
            echo "This workflow only provisions development from the dev branch."
            exit 1
          fi

          if [[ "${DEVELOPMENT_DOMAIN}" != dev.* ]]; then
            echo "Development domains must start with dev.; production domains are not allowed."
            exit 1
          fi

      - name: Discover and optionally provision Coolify resource
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${COOLIFY_API_TOKEN}"
          if [ -n "${COOLIFY_SSH_PRIVATE_KEY:-}" ]; then
            echo "::add-mask::${COOLIFY_SSH_PRIVATE_KEY}"
          fi
          if [ -n "${COOLIFY_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::add-mask::${COOLIFY_SSH_KNOWN_HOSTS}"
          fi

          if [ "${{ inputs.dry_run }}" = "false" ]; then
            install -m 700 -d "${RUNNER_TEMP}/coolify-ssh"
            printf '%s\n' "${COOLIFY_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/coolify-ssh/key"
            printf '%s\n' "${COOLIFY_SSH_KNOWN_HOSTS}" > "${RUNNER_TEMP}/coolify-ssh/known_hosts"
            chmod 600 "${RUNNER_TEMP}/coolify-ssh/key"
            chmod 644 "${RUNNER_TEMP}/coolify-ssh/known_hosts"
            export COOLIFY_SSH_KEY_PATH="${RUNNER_TEMP}/coolify-ssh/key"
            export COOLIFY_SSH_KNOWN_HOSTS_PATH="${RUNNER_TEMP}/coolify-ssh/known_hosts"
          fi

          python scripts/provision_coolify_development.py \
            --dry-run "${{ inputs.dry_run }}" \
            --product "${{ inputs.product }}" \
            --repository "${{ inputs.repository }}" \
            --branch "${{ inputs.branch }}" \
            --compose "${{ inputs.compose }}" \
            --domain "${{ inputs.domain }}" \
            --coolify-github-app-name "${{ inputs.coolify_github_app_name }}"
