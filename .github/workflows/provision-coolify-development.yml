name: Provision Coolify development environment

on:
  push:
    branches:
      - dev
    paths:
      - 'products/*.json'
      - 'scripts/provision_coolify_development.py'
      - '.github/workflows/provision-coolify-development.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Keep true to only discover resources and print planned changes.'
        type: choice
        required: true
        default: 'true'
        options:
          - 'true'
          - 'false'
      product:
        description: 'GoodMorning product slug.'
        required: true
        default: factory-smoke-test
      repository:
        description: 'GitHub owner/repository.'
        required: true
        default: goodmorning-mx/factory-smoke-test
      branch:
        description: 'Git branch to deploy.'
        required: true
        default: dev
      compose:
        description: 'Docker Compose path in the repository.'
        required: true
        default: /compose.yaml
      domain:
        description: 'Development domain.'
        required: true
        default: dev.factory-smoke-test.goodmorning.mx
      coolify_github_app_name:
        description: 'Exact Coolify GitHub App source name.'
        required: true
        default: goodmorning-mx-coolify
      deploy:
        description: 'Request an explicit Coolify deployment after configuration.'
        type: choice
        required: true
        default: 'false'
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  issues: write

jobs:
  provision-coolify-development:
    name: Provision Coolify development environment
    runs-on: ubuntu-latest
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_SERVER_NAME: ${{ vars.COOLIFY_SERVER_NAME || 'development' }}
      COOLIFY_DESTINATION_UUID: ${{ vars.COOLIFY_DESTINATION_UUID || 'bk8cw0gkswgo04o0s88sk0kg' }}
      DEVELOPMENT_DOMAIN: ${{ inputs.domain }}
      COOLIFY_ALLOW_REAL_DEPLOYMENT: ${{ vars.COOLIFY_ALLOW_REAL_DEPLOYMENT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate safety gates and configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_BASE_URL:-}" ]; then
            echo "COOLIFY_BASE_URL repository variable is required."
            exit 1
          fi

          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "COOLIFY_API_TOKEN repository secret is required."
            exit 1
          fi

          echo "::add-mask::${COOLIFY_API_TOKEN}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.branch }}" != "dev" ]; then
            echo "This workflow only provisions development from the dev branch."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [[ "${DEVELOPMENT_DOMAIN}" != dev.* ]]; then
            echo "Development domains must start with dev.; production domains are not allowed."
            exit 1
          fi

          if { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.deploy }}" = "true" ]; } && [ "${COOLIFY_ALLOW_REAL_DEPLOYMENT:-}" != "true" ]; then
            echo "Set repository variable COOLIFY_ALLOW_REAL_DEPLOYMENT=true before requesting a real Coolify deployment."
            exit 1
          fi

      - name: Discover and optionally provision Coolify resource
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${COOLIFY_API_TOKEN}"

          output_file="$(mktemp)"
          python scripts/provision_coolify_development.py \
            --dry-run "${{ inputs.dry_run }}" \
            --product "${{ inputs.product }}" \
            --repository "${{ inputs.repository }}" \
            --branch "${{ inputs.branch }}" \
            --compose "${{ inputs.compose }}" \
            --domain "${{ inputs.domain }}" \
            --coolify-github-app-name "${{ inputs.coolify_github_app_name }}" \
            --server "${COOLIFY_SERVER_NAME}" \
            --destination-uuid "${COOLIFY_DESTINATION_UUID}" \
            --deploy "${{ inputs.deploy }}" | tee "${output_file}"

          if python - "${output_file}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              lines = [line.strip() for line in handle if line.strip()]

          for line in lines:
              try:
                  payload = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(payload, dict) and payload.get("status") in {"recreate_required", "manual_review_required"}:
                  sys.exit(0)
          sys.exit(1)
          PY
          then
            echo "Coolify provisioning returned status=recreate_required or manual_review_required; failing workflow."
            exit 1
          fi

      - name: Reconcile development products from catalog
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${COOLIFY_API_TOKEN}"
          status_file="${RUNNER_TEMP}/coolify-reconcile.log"
          : > "${status_file}"

          shopt -s nullglob
          manifests=(products/*.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No product manifests found."
            exit 1
          fi

          for manifest in "${manifests[@]}"; do
            topology="$(jq -r '.topology // "compose-v1"' "${manifest}")"
            if [ "${topology}" != "compose-v1" ]; then
              echo "Skipping ${manifest}: topology=${topology}"
              continue
            fi

            product="$(jq -er '.product' "${manifest}")"
            repository="$(jq -er '.repository' "${manifest}")"
            branch="$(jq -er '.branch // "dev"' "${manifest}")"
            compose="$(jq -er '.compose // "/compose.yaml"' "${manifest}")"
            domain="$(jq -er '.development_domain' "${manifest}")"
            github_app="$(jq -er '.coolify_github_app_name // "goodmorning-mx-coolify"' "${manifest}")"

            echo "Reconciling ${product} from ${manifest}"
            set +e
            python scripts/provision_coolify_development.py \
              --dry-run false \
              --product "${product}" \
              --repository "${repository}" \
              --branch "${branch}" \
              --compose "${compose}" \
              --domain "${domain}" \
              --coolify-github-app-name "${github_app}" \
              --server "${COOLIFY_SERVER_NAME}" \
              --destination-uuid "${COOLIFY_DESTINATION_UUID}" \
              --deploy true 2>&1 | tee -a "${status_file}"
            provision_status="${PIPESTATUS[0]}"
            set -e
            if [ "${provision_status}" -ne 0 ]; then
              exit "${provision_status}"
            fi
          done

      - name: Report sanitized reconciliation failure
        if: failure() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/coolify-reconcile.log"
          issue_body="${RUNNER_TEMP}/coolify-reconcile-issue.md"
          {
            echo "The automatic Coolify development reconciliation failed."
            echo
            echo "- Commit: ${{ github.sha }}"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```text'
            if [ -s "${status_file}" ]; then
              tail -n 200 "${status_file}"
            else
              echo "The workflow failed before the provisioner produced output. Check repository variables and secrets."
            fi
            echo '```'
          } > "${issue_body}"

          title="[automation] Coolify development reconciliation failed"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file "${issue_body}"
          else
            gh issue create --title "${title}" --body-file "${issue_body}"
          fi
