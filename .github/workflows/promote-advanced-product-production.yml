name: Promote one advanced GoodMorning product to production

on:
  repository_dispatch:
    types:
      - promote-advanced-product
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Exact production/<product>.json resources-v3-production manifest.
        required: true
        type: string
      confirmation:
        description: Type deploy:<product>:production exactly.
        required: true
        type: string
      portal_environment:
        description: Software portal that owns this product operation.
        required: false
        type: choice
        options: [dev, production]
        default: dev
      operation_id:
        description: Optional Software portal operation identifier.
        required: false
        type: string

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: goodmorning-factory-advanced-production-${{ github.event.client_payload.product || inputs.manifest_path }}
  cancel-in-progress: false

jobs:
  reconcile-production:
    name: Reconcile one advanced production product
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_SERVER_NAME: ${{ vars.COOLIFY_SERVER_NAME || 'localhost' }}
      COOLIFY_DESTINATION_UUID: ${{ vars.COOLIFY_RESOURCES_DESTINATION_UUID || 'g61slcctgnbvhhc8si0h9tf0' }}
      COOLIFY_ALLOW_REAL_DEPLOYMENT: ${{ vars.COOLIFY_ALLOW_REAL_DEPLOYMENT }}
      GOODMORNING_MANAGED_OPENAI_API_KEY: ${{ secrets.GOODMORNING_MANAGED_OPENAI_API_KEY }}
      GOODMORNING_MANAGED_STRIPE_SECRET_KEY: ${{ secrets.GOODMORNING_MANAGED_STRIPE_SECRET_KEY }}
      GOODMORNING_MANAGED_STRIPE_WEBHOOK_SECRET: ${{ secrets.GOODMORNING_MANAGED_STRIPE_WEBHOOK_SECRET }}
      GOODMORNING_MANAGED_CV_PRODUCTION_STRIPE_SECRET_KEY: ${{ secrets.GOODMORNING_MANAGED_CV_PRODUCTION_STRIPE_SECRET_KEY }}
      GOODMORNING_MANAGED_CV_PRODUCTION_STRIPE_WEBHOOK_SECRET: ${{ secrets.GOODMORNING_MANAGED_CV_PRODUCTION_STRIPE_WEBHOOK_SECRET }}
      HOSTING_ADMIN_BOOTSTRAP_PASSWORD_HASH: ${{ secrets.HOSTING_ADMIN_BOOTSTRAP_PASSWORD_HASH }}
      OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
      OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
      OCI_S3_BUCKET: ${{ vars.OCI_S3_BUCKET }}
      OCI_S3_REGION: ${{ vars.OCI_S3_REGION }}
      OCI_S3_ENDPOINT: ${{ vars.OCI_S3_ENDPOINT }}
    steps:
      - name: Check out reviewed Factory dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Resolve production product repository scope
        id: scope
        shell: bash
        env:
          REQUESTED_MANIFEST: ${{ inputs.manifest_path }}
          EVENT_PRODUCT: ${{ github.event.client_payload.product }}
          EVENT_MANIFEST_PATH: ${{ github.event.client_payload.manifest_path }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            product="${EVENT_PRODUCT}"
            manifest="${EVENT_MANIFEST_PATH}"
          else
            manifest="${REQUESTED_MANIFEST}"
            [[ "${manifest}" =~ ^production/[a-z0-9][a-z0-9-]*\.json$ ]]
            product="$(jq -er '.product' "${manifest}")"
          fi
          [[ "${product}" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          test "${manifest}" = "production/${product}.json"
          test -f "${manifest}"
          test "$(jq -er '.product' "${manifest}")" = "${product}"
          test "$(jq -er '.repository' "${manifest}")" = "goodmorning-mx/${product}"
          echo "product=${product}" >> "${GITHUB_OUTPUT}"

      - name: Create source verification token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GOODMORNING_FACTORY_APP_ID }}
          private-key: ${{ secrets.GOODMORNING_FACTORY_PRIVATE_KEY }}
          owner: goodmorning-mx
          repositories: goodmorning-factory,${{ steps.scope.outputs.product }}
          permission-actions: read
          permission-contents: read

      - name: Validate production release authorization
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REQUESTED_MANIFEST: ${{ inputs.manifest_path }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_PRODUCT: ${{ github.event.client_payload.product }}
          EVENT_REPOSITORY: ${{ github.event.client_payload.repository }}
          EVENT_SOURCE_BRANCH: ${{ github.event.client_payload.source_branch }}
          EVENT_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          EVENT_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          EVENT_MANIFEST_PATH: ${{ github.event.client_payload.manifest_path }}
          EVENT_PORTAL_ENVIRONMENT: ${{ github.event.client_payload.portal_environment }}
          EVENT_OPERATION_ID: ${{ github.event.client_payload.operation_id }}
          REQUESTED_PORTAL_ENVIRONMENT: ${{ inputs.portal_environment || 'dev' }}
          REQUESTED_OPERATION_ID: ${{ inputs.operation_id || '' }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            product="${EVENT_PRODUCT}"
            repository="${EVENT_REPOSITORY}"
            source_branch="${EVENT_SOURCE_BRANCH}"
            source_sha="${EVENT_SOURCE_SHA}"
            source_run_id="${EVENT_SOURCE_RUN_ID}"
            manifest="${EVENT_MANIFEST_PATH}"
            portal_environment="${EVENT_PORTAL_ENVIRONMENT}"
            operation_id="${EVENT_OPERATION_ID}"
            test "${manifest}" = "production/${product}.json"
            [[ "${source_run_id}" =~ ^[0-9]+$ ]]
          else
            manifest="${REQUESTED_MANIFEST}"
            [[ "${manifest}" =~ ^production/[a-z0-9][a-z0-9-]*\.json$ ]]
            product="$(jq -er '.product' "${manifest}")"
            repository="$(jq -er '.repository' "${manifest}")"
            source_branch="main"
            source_sha="$(gh api "/repos/${repository}/branches/main" --jq '.commit.sha')"
            runs="$(gh api "/repos/${repository}/actions/runs?branch=main&event=push&per_page=100")"
            source_run_id="$(jq -er --arg sha "${source_sha}" '[.workflow_runs[] | select(.name == "CI" and .status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "main" and .head_sha == $sha)] | sort_by(.run_started_at) | last | .id' <<<"${runs}")"
            portal_environment="${REQUESTED_PORTAL_ENVIRONMENT}"
            operation_id="${REQUESTED_OPERATION_ID}"
            test "${REQUESTED_CONFIRMATION}" = "deploy:${product}:production"
          fi
          [[ "${product}" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          test "${repository}" = "goodmorning-mx/${product}"
          [[ "${portal_environment}" =~ ^(dev|production)$ ]]
          if [ -n "${operation_id}" ]; then [[ "${operation_id}" =~ ^[0-9a-fA-F-]{36}$ ]]; fi
          test "${source_branch}" = "main"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          test -f "${manifest}"
          test "$(jq -er '.topology' "${manifest}")" = "resources-v3-production"
          test "$(jq -er '.product' "${manifest}")" = "${product}"
          test "$(jq -er '.repository' "${manifest}")" = "${repository}"
          test "$(jq -er '.branch' "${manifest}")" = "main"
          test "$(jq -r '.confirm_production // false' "${manifest}")" = "true"
          if [ "${product}" = "cv" ]; then
            payment_mode="$(jq -er '.modules[] | select(.name == "gm-payments") | .env[] | select(.key == "PAYMENT_MODE") | .default' "${manifest}")"
            python scripts/validate_cv_production_secrets.py --mode "${payment_mode}"
          fi
          current_sha="$(gh api "/repos/${repository}/branches/main" --jq '.commit.sha')"
          test "${current_sha}" = "${source_sha}"
          if [ "${source_run_id}" ]; then
            test "$(jq -r '.promotion_policy // empty' "${manifest}")" = "auto-on-main"
            run_json="$(gh api "/repos/${repository}/actions/runs/${source_run_id}")"
            test "$(jq -r '.name' <<<"${run_json}")" = "CI"
            test "$(jq -r '.event' <<<"${run_json}")" = "push"
            test "$(jq -r '.conclusion' <<<"${run_json}")" = "success"
            test "$(jq -r '.head_branch' <<<"${run_json}")" = "main"
            test "$(jq -r '.head_sha' <<<"${run_json}")" = "${source_sha}"
          fi
          test -n "${COOLIFY_BASE_URL:-}"
          test -n "${COOLIFY_API_TOKEN:-}"
          test "${COOLIFY_ALLOW_REAL_DEPLOYMENT:-}" = "true"
          echo "::add-mask::${COOLIFY_API_TOKEN}"
          {
            echo "manifest=${manifest}"
            echo "product=${product}"
            echo "source_sha=${source_sha}"
            echo "source_run_id=${source_run_id}"
            echo "portal_environment=${portal_environment}"
            echo "operation_id=${operation_id}"
            frontend_url="$(jq -r '.routing.host // empty' "${manifest}")"
            if [ -z "${frontend_url}" ]; then
              frontend_url="$(jq -er '.applications[] | select(.role == "frontend" and .domain != null) | .domain' "${manifest}")"
            fi
            echo "environment_url=${frontend_url}"
            repository_id="$(gh api "/repos/${repository}" --jq '.id')"
            [[ "${repository_id}" =~ ^[0-9]+$ ]]
            echo "repository_id=${repository_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Report production promotion started
        if: steps.authorize.outputs.operation_id != ''
        uses: ./.github/actions/report-portal-event
        with:
          operation-id: ${{ steps.authorize.outputs.operation_id }}
          product-slug: ${{ steps.authorize.outputs.product }}
          stage: deployment
          status: in_progress
          title: Promoción a producción iniciada
          summary: Factory validó la CI de main y comenzó el despliegue protegido.
          repository-id: ${{ steps.authorize.outputs.repository_id }}
          source-sha: ${{ steps.authorize.outputs.source_sha }}
          portal-environment: ${{ steps.authorize.outputs.portal_environment }}

      - name: Plan production changes read-only
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          plan_file="${RUNNER_TEMP}/production-plan.json"
          python scripts/reconcile_advanced_product.py \
            --manifest "${{ steps.authorize.outputs.manifest }}" \
            --phase plan \
            --server "${COOLIFY_SERVER_NAME}" \
            --destination-uuid "${COOLIFY_DESTINATION_UUID}" | tee "${plan_file}"
          if jq -e '.actions[] | select(.kind == "database" and .action == "would_create")' "${plan_file}" >/dev/null; then
            echo "needs_bootstrap=true" >> "${GITHUB_OUTPUT}"
          else
            echo "needs_bootstrap=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Bootstrap missing production resources without deployment
        if: steps.plan.outputs.needs_bootstrap == 'true'
        shell: bash
        env:
          COOLIFY_ALLOW_ADVANCED_PRODUCTION_WRITES: "true"
        run: |
          python scripts/reconcile_advanced_product.py \
            --manifest "${{ steps.authorize.outputs.manifest }}" \
            --phase apply \
            --server "${COOLIFY_SERVER_NAME}" \
            --destination-uuid "${COOLIFY_DESTINATION_UUID}" \
            --confirm-product "${{ steps.authorize.outputs.product }}" \
            --confirm-environment production

      - name: Verify pre-deployment production backup
        shell: bash
        run: |
          echo "::add-mask::${OCI_S3_ACCESS_KEY}"
          echo "::add-mask::${OCI_S3_SECRET_KEY}"
          python scripts/reconcile_database_backups.py \
            --manifest "${{ steps.authorize.outputs.manifest }}" \
            --backup-now true

      - name: Apply and deploy exact advanced production topology
        shell: bash
        env:
          COOLIFY_ALLOW_ADVANCED_PRODUCTION_WRITES: "true"
        run: |
          python scripts/reconcile_advanced_product.py \
            --manifest "${{ steps.authorize.outputs.manifest }}" \
            --phase apply \
            --server "${COOLIFY_SERVER_NAME}" \
            --destination-uuid "${COOLIFY_DESTINATION_UUID}" \
            --confirm-product "${{ steps.authorize.outputs.product }}" \
            --confirm-environment production \
            --deploy

      - name: Smoke every public production application
        shell: bash
        run: |
          set -euo pipefail
          manifest="${{ steps.authorize.outputs.manifest }}"
          while IFS=$'\t' read -r domain health_path; do
            target="${domain}${health_path}"
            curl --fail --silent --show-error \
              --retry 30 --retry-delay 10 --retry-all-errors \
              --max-time 20 "${target}" >/dev/null
          done < <(jq -r '.applications[] | select(.domain != null) | [.domain, .health_path] | @tsv' "${manifest}")

      - name: Verify product database migration through the API
        shell: bash
        run: |
          set -euo pipefail
          manifest="${{ steps.authorize.outputs.manifest }}"
          api_domain="$(jq -er '.applications[] | select(.role == "api") | .domain' "${manifest}")"
          probe="${api_domain}/api/v1/invitations/factory-migration-probe-${{ steps.authorize.outputs.source_sha }}"
          status=""
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${probe}" || true)"
            if [ "${status}" = "404" ]; then break; fi
            sleep 10
          done
          test "${status}" = "404"

      - name: Verify public production runtimes report the exact source SHA
        id: runtime-version
        env:
          MANIFEST: ${{ steps.authorize.outputs.manifest }}
          EXPECTED_SHA: ${{ steps.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          api_domain="$(jq -er '.applications[] | select(.role == "api") | .domain' "${MANIFEST}")"
          profile="$(jq -er '.frontend_profile // "react"' "${MANIFEST}")"
          frontend_domain="$(jq -r '.routing.host // empty' "${MANIFEST}")"
          if [ -z "${frontend_domain}" ]; then
            frontend_domain="$(jq -er '.applications[] | select(.role == "frontend" and .domain != null) | .domain' "${MANIFEST}")"
          fi
          case "${profile}" in
            react|next) frontend_path="/version.json" ;;
            hybrid) frontend_path="/app/version.json" ;;
            *) echo "Unsupported frontend profile." >&2; exit 1 ;;
          esac
          observed_api=""
          observed_frontend=""
          for attempt in $(seq 1 36); do
            observed_api="$(curl --silent --show-error --fail --max-time 8 "${api_domain}/version" 2>/dev/null | jq -r '.commit_sha // empty' 2>/dev/null || true)"
            observed_frontend="$(curl --silent --show-error --fail --max-time 8 "${frontend_domain}${frontend_path}" 2>/dev/null | jq -r '.commit_sha // empty' 2>/dev/null || true)"
            if [ "${observed_api}" = "${EXPECTED_SHA}" ] && [ "${observed_frontend}" = "${EXPECTED_SHA}" ]; then
              echo "observed_sha=${EXPECTED_SHA}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            [ "${attempt}" -eq 36 ] || sleep 10
          done
          echo "Runtime version mismatch (API=${observed_api:-unavailable}, frontend=${observed_frontend:-unavailable})." >&2
          echo "observed_sha=${observed_frontend:-${observed_api}}" >> "${GITHUB_OUTPUT}"
          exit 1

      - name: Report exact production runtime SHA
        if: always() && steps.authorize.outputs.operation_id != ''
        uses: ./.github/actions/report-portal-event
        with:
          operation-id: ${{ steps.authorize.outputs.operation_id }}
          product-slug: ${{ steps.authorize.outputs.product }}
          stage: verification
          status: ${{ steps.runtime-version.outcome == 'success' && 'success' || 'failure' }}
          title: ${{ steps.runtime-version.outcome == 'success' && 'Versión de producción confirmada' || 'Versión de producción sin confirmar' }}
          summary: ${{ steps.runtime-version.outcome == 'success' && 'API y frontend reportan la SHA exacta liberada en main.' || 'Factory no pudo confirmar la SHA esperada en API y frontend.' }}
          repository-id: ${{ steps.authorize.outputs.repository_id }}
          source-sha: ${{ steps.authorize.outputs.source_sha }}
          environment: production
          desired-sha: ${{ steps.authorize.outputs.source_sha }}
          observed-sha: ${{ steps.runtime-version.outputs.observed_sha }}
          environment-url: ${{ steps.authorize.outputs.environment_url }}
          portal-environment: ${{ steps.authorize.outputs.portal_environment }}

      - name: Verify post-deployment production backup
        shell: bash
        run: |
          python scripts/reconcile_database_backups.py \
            --manifest "${{ steps.authorize.outputs.manifest }}" \
            --backup-now true

      - name: Publish production summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Advanced production promotion verified"
            echo
            echo "- Product: \`${{ steps.authorize.outputs.product }}\`"
            echo "- Source: \`${{ steps.authorize.outputs.source_sha }}\`"
            echo "- Every public health contract passed"
            echo "- MCP security migration was exercised through the production API"
            echo "- Pre/post deployment backups verified"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report production promotion completed
        if: success() && steps.authorize.outputs.operation_id != ''
        uses: ./.github/actions/report-portal-event
        with:
          operation-id: ${{ steps.authorize.outputs.operation_id }}
          product-slug: ${{ steps.authorize.outputs.product }}
          stage: ready
          status: success
          title: Producción lista
          summary: Backup anterior y posterior, migración, healthchecks y SHA exacta quedaron verificados.
          repository-id: ${{ steps.authorize.outputs.repository_id }}
          source-sha: ${{ steps.authorize.outputs.source_sha }}
          portal-environment: ${{ steps.authorize.outputs.portal_environment }}

      - name: Report production promotion failure
        if: failure() && steps.authorize.outcome == 'success' && steps.authorize.outputs.operation_id != ''
        uses: ./.github/actions/report-portal-event
        with:
          operation-id: ${{ steps.authorize.outputs.operation_id }}
          product-slug: ${{ steps.authorize.outputs.product }}
          stage: failed
          status: failure
          title: Promoción detenida
          summary: Factory detuvo una etapa de producción. Consulta el workflow vinculado para ver el motivo.
          repository-id: ${{ steps.authorize.outputs.repository_id }}
          source-sha: ${{ steps.authorize.outputs.source_sha }}
          portal-environment: ${{ steps.authorize.outputs.portal_environment }}

      - name: Report sanitized production failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[automation] GoodMorning advanced production reconciliation failed"
          body="Advanced production reconciliation failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then gh issue comment "${existing}" --body "${body}"; else gh issue create --title "${title}" --body "${body}"; fi
