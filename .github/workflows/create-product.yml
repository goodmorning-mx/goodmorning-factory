name: Create GoodMorning product repository

on:
  pull_request:
    branches:
      - dev
    types:
      - closed
    paths:
      - 'requests/*.json'
  workflow_dispatch:
    inputs:
      product_name:
        description: Repository slug for the new product.
        required: true
        type: string
      description:
        description: Product repository description.
        required: true
        type: string
      confirm_provision:
        description: Confirm that a private product repository should be provisioned.
        required: true
        type: boolean
        default: false
      frontend_profile:
        description: Frontend profile for the product.
        required: true
        type: choice
        options:
          - react
          - next
          - hybrid
        default: react
      operation_id:
        description: Portal operation identifier for Factory status callbacks.
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  issues: write
  actions: write

concurrency:
  group: create-product-${{ github.event.inputs.product_name || github.sha }}
  cancel-in-progress: false

jobs:
  create-product:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    name: Provision product repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_SERVER_NAME: ${{ vars.COOLIFY_SERVER_NAME || 'localhost' }}
      COOLIFY_DESTINATION_UUID: ${{ vars.COOLIFY_RESOURCES_DESTINATION_UUID || 'g61slcctgnbvhhc8si0h9tf0' }}
      COOLIFY_GITHUB_APP_NAME: ${{ vars.COOLIFY_GITHUB_APP_NAME || 'goodmorning-mx-coolify' }}
      COOLIFY_ALLOW_REAL_DEPLOYMENT: ${{ vars.COOLIFY_ALLOW_REAL_DEPLOYMENT }}
      OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
      OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
      OCI_S3_BUCKET: ${{ vars.OCI_S3_BUCKET }}
      OCI_S3_REGION: ${{ vars.OCI_S3_REGION }}
      OCI_S3_ENDPOINT: ${{ vars.OCI_S3_ENDPOINT }}
    steps:
      - name: Check out factory dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve product request
        id: request
        shell: bash
        env:
          USER_PRODUCT_NAME: ${{ inputs.product_name || '' }}
          USER_DESCRIPTION: ${{ inputs.description || '' }}
          USER_CONFIRM_PROVISION: ${{ inputs.confirm_provision || '' }}
          USER_FRONTEND_PROFILE: ${{ inputs.frontend_profile || '' }}
          OPERATION_ID: ${{ inputs.operation_id || '' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            product_name="${USER_PRODUCT_NAME}"
            description="${USER_DESCRIPTION}"
            confirm_provision="${USER_CONFIRM_PROVISION}"
            frontend_profile="${USER_FRONTEND_PROFILE}"
            operation_id="${OPERATION_ID}"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            mapfile -t requests < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.merge_commit_sha }}" -- 'requests/*.json')
            if [ "${#requests[@]}" -ne 1 ] || [ ! -f "${requests[0]}" ]; then
              echo "A merged product request PR must add or change exactly one requests/<product>.json file."
              exit 1
            fi
            product_name="$(jq -er '.product_name' "${requests[0]}")"
            description="$(jq -er '.description' "${requests[0]}")"
            confirm_provision="$(jq -r '.confirm_provision // false' "${requests[0]}")"
            frontend_profile="$(jq -r '.frontend_profile // "react"' "${requests[0]}")"
            operation_id=""
          else
            mapfile -t requests < <(git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}" -- 'requests/*.json')
            if [ "${#requests[@]}" -ne 1 ] || [ ! -f "${requests[0]}" ]; then
              echo "A product request push must add or change exactly one requests/<product>.json file."
              exit 1
            fi
            product_name="$(jq -er '.product_name' "${requests[0]}")"
            description="$(jq -er '.description' "${requests[0]}")"
            confirm_provision="$(jq -r '.confirm_provision // false' "${requests[0]}")"
            frontend_profile="$(jq -r '.frontend_profile // "react"' "${requests[0]}")"
            operation_id=""
          fi
          if [ -n "${operation_id}" ] && ! [[ "${operation_id}" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Invalid operation_id."
            exit 1
          fi
          if [ "${#product_name}" -gt 63 ] || ! [[ "${product_name}" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "Invalid product name."
            exit 1
          fi
          case "${frontend_profile}" in
            react|next|hybrid) ;;
            *) echo "Invalid frontend profile."; exit 1 ;;
          esac
          delimiter="GOODMORNING_DESCRIPTION_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            echo "product_name=${product_name}"
            echo "confirm_provision=${confirm_provision}"
            echo "frontend_profile=${frontend_profile}"
            echo "operation_id=${operation_id}"
            echo "description<<${delimiter}"
            printf '%s\n' "${description}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Refuse unconfirmed provisioning
        if: ${{ steps.request.outputs.confirm_provision != 'true' }}
        run: |
          echo "confirm_provision must be true before provisioning." >&2
          exit 1

      - name: Validate frontend profile
        run: |
          case "${{ steps.request.outputs.frontend_profile }}" in
            react|next|hybrid) ;;
            *) echo "frontend_profile must be react, next, or hybrid." >&2; exit 1 ;;
          esac

      - name: Validate product name before requesting token
        env:
          REQUESTED_PRODUCT_NAME: ${{ steps.request.outputs.product_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          name = os.environ["REQUESTED_PRODUCT_NAME"]
          reserved = {"goodmorning-factory", "goodmorning-mvp-template"}
          if not name or len(name) > 63 or name in reserved or not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]*[a-z0-9])?", name):
              print("Invalid product_name. Use lowercase letters, numbers, and hyphens; start/end with a letter or number; avoid reserved names; max 63 characters.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GOODMORNING_FACTORY_APP_ID }}
          private-key: ${{ secrets.GOODMORNING_FACTORY_PRIVATE_KEY }}
          owner: goodmorning-mx

      - name: Provision repository from template
        id: provision
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRODUCT_NAME: ${{ steps.request.outputs.product_name }}
          PRODUCT_DESCRIPTION: ${{ steps.request.outputs.description }}
        run: |
          set -euo pipefail
          if python3 scripts/create_product.py \
            --name "${PRODUCT_NAME}" \
            --description "${PRODUCT_DESCRIPTION}" \
            --owner goodmorning-mx \
            --template-owner goodmorning-mx \
            --template-repo goodmorning-mvp-template \
            > provisioning-result.json 2> provisioning-error.json; then
            cat provisioning-result.json
          else
            cat provisioning-error.json >&2
            cp provisioning-error.json provisioning-result.json
            exit 1
          fi

      - name: Report repository creation stage
        if: steps.request.outputs.operation_id != ''
        uses: ./.github/actions/report-portal-event
        with:
          operation-id: ${{ steps.request.outputs.operation_id }}
          product-slug: ${{ steps.request.outputs.product_name }}
          stage: repository
          status: in_progress
          title: Repositorio creado
          summary: Factory creó el repositorio y continúa con la configuración del producto.

      - name: Register repository-first product manifest
        id: catalog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BACKUP_STORAGE_UUID: ${{ vars.COOLIFY_BACKUP_STORAGE_UUID || 'c1rrntk8wv4cf3tl3wqviwp3' }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          python3 scripts/register_product_manifest.py \
            --product "${{ steps.request.outputs.product_name }}" \
            --backup-storage-uuid "${BACKUP_STORAGE_UUID}" \
            --factory-branch dev \
            --frontend-profile "${{ steps.request.outputs.frontend_profile }}" \
            > catalog-result.json
          cat catalog-result.json
          manifest_path="$(jq -er '.manifest_path' catalog-result.json)"
          mkdir -p "$(dirname "${manifest_path}")"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "/repos/goodmorning-mx/goodmorning-factory/contents/${manifest_path}?ref=dev" \
            > "${manifest_path}"
          jq -e \
            --arg product "${{ steps.request.outputs.product_name }}" \
            '.topology == "resources-v3" and .product == $product' \
            "${manifest_path}" > /dev/null
          echo "manifest_path=${manifest_path}" >> "${GITHUB_OUTPUT}"

      - name: Register automatic production manifest
        id: production-catalog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BACKUP_STORAGE_UUID: ${{ vars.COOLIFY_BACKUP_STORAGE_UUID || 'c1rrntk8wv4cf3tl3wqviwp3' }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          python3 -m scripts.register_production_manifest \
            --product "${{ steps.request.outputs.product_name }}" \
            --backup-storage-uuid "${BACKUP_STORAGE_UUID}" \
            --factory-branch dev \
            --frontend-profile "${{ steps.request.outputs.frontend_profile }}" \
            > production-catalog-result.json
          cat production-catalog-result.json

      - name: Report resource registration stage
        if: steps.request.outputs.operation_id != ''
        uses: ./.github/actions/report-portal-event
        with:
          operation-id: ${{ steps.request.outputs.operation_id }}
          product-slug: ${{ steps.request.outputs.product_name }}
          stage: provisioning
          status: in_progress
          title: Recursos registrados
          summary: Factory preparó los manifiestos DEV y producción; ahora reconcilia la infraestructura DEV.

      - name: Create deployment verification sentinel
        id: sentinel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          product="${{ steps.request.outputs.product_name }}"
          title="[automation] Verify repository-first product ${product}"
          issue_number="$(gh issue list --state open --search "\"${title}\" in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -z "${issue_number}" ]; then
            issue_url="$(gh issue create \
              --title "${title}" \
              --body "Verification sentinel for repository-first product \`${product}\`. This issue closes only after frontend, API, private PostgreSQL, and Oracle backup verification succeed.")"
            issue_number="${issue_url##*/}"
          fi
          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]]; then
            echo "Unable to create or parse the deployment verification issue number."
            exit 1
          fi
          echo "issue_number=${issue_number}" >> "${GITHUB_OUTPUT}"

      - name: Reconcile and verify targeted Coolify product
        env:
          COOLIFY_ALLOW_RESOURCE_WRITES: 'true'
          COOLIFY_ALLOW_DATABASE_START: 'true'
          COOLIFY_ALLOW_BACKEND_APPLICATION_WRITES: 'true'
          COOLIFY_ALLOW_BACKEND_ENV_WRITES: 'true'
          COOLIFY_ALLOW_FRONTEND_APPLICATION_WRITES: 'true'
          COOLIFY_ALLOW_FRONTEND_ENV_WRITES: 'true'
          COOLIFY_ALLOW_DEPLOYMENTS: 'true'
          COOLIFY_ALLOW_BACKEND_DEPLOYMENT: 'true'
          COOLIFY_ALLOW_FRONTEND_DEPLOYMENT: 'true'
          COOLIFY_ALLOW_ADVANCED_WRITES: 'true'
        run: |
          set -euo pipefail
          echo "::add-mask::${COOLIFY_API_TOKEN}"
          manifest="${{ steps.catalog.outputs.manifest_path }}"
          converged=false
          for attempt in $(seq 1 6); do
            set +e
            python -m scripts.reconcile_resources \
              --manifest "${manifest}" \
              --phase apply \
              --operation deploy-full \
              --server "${COOLIFY_SERVER_NAME}" \
              --github-app "${COOLIFY_GITHUB_APP_NAME}" \
              --destination-uuid "${COOLIFY_DESTINATION_UUID}"
            code=$?
            set -e
            if [ "${code}" -eq 0 ]; then
              converged=true
              break
            fi
            [ "${attempt}" -eq 6 ] || sleep $((20 * attempt))
          done
          if [ "${converged}" != "true" ]; then
            echo "Targeted Coolify reconciliation did not converge."
            exit 1
          fi

      - name: Report deployment stage
        if: steps.request.outputs.operation_id != ''
        uses: ./.github/actions/report-portal-event
        with:
          operation-id: ${{ steps.request.outputs.operation_id }}
          product-slug: ${{ steps.request.outputs.product_name }}
          stage: deployment
          status: in_progress
          title: Aplicaciones DEV desplegadas
          summary: Coolify completó la reconciliación de las aplicaciones y la base privada DEV.

      - name: Verify Oracle database backup
        run: |
          set -euo pipefail
          echo "::add-mask::${OCI_S3_ACCESS_KEY}"
          echo "::add-mask::${OCI_S3_SECRET_KEY}"
          python scripts/reconcile_database_backups.py \
            --manifest "${{ steps.catalog.outputs.manifest_path }}" \
            --backup-now true

      - name: Report backup verification stage
        if: steps.request.outputs.operation_id != ''
        uses: ./.github/actions/report-portal-event
        with:
          operation-id: ${{ steps.request.outputs.operation_id }}
          product-slug: ${{ steps.request.outputs.product_name }}
          stage: verification
          status: in_progress
          title: Backup DEV verificado
          summary: Factory verificó el backup externo de PostgreSQL DEV.

      - name: Close verified deployment sentinel
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.sentinel.outputs.issue_number }}
        run: |
          gh issue close "${ISSUE_NUMBER}" --reason completed \
            --comment "Repository, frontend, API, PostgreSQL and Oracle backup verified by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish provisioning summary
        if: always()
        run: |
          {
            echo "## GoodMorning product provisioning"
            echo
            echo "- Product: \`${{ steps.request.outputs.product_name }}\`"
            echo "- Template: \`goodmorning-mx/goodmorning-mvp-template\`"
            echo "- Owner: \`goodmorning-mx\`"
            echo "- Frontend: https://dev.${{ steps.request.outputs.product_name }}.goodmorning.mx"
            echo "- API: https://api.dev.${{ steps.request.outputs.product_name }}.goodmorning.mx/health"
            echo
            if [ -f provisioning-result.json ]; then
              echo "### Result"
              echo '```json'
              cat provisioning-result.json
              echo '```'
            else
              echo "Provisioning did not produce a result file. Check job logs for the validation or API error."
            fi
            echo
            echo "The workflow never prints token or private-key material."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report product creation completed
        if: ${{ success() && steps.request.outputs.operation_id != '' }}
        uses: ./.github/actions/report-portal-event
        with:
          operation-id: ${{ steps.request.outputs.operation_id }}
          product-slug: ${{ steps.request.outputs.product_name }}
          stage: ready
          status: success
          title: Producto listo
          summary: El repositorio, despliegue DEV, PostgreSQL privado y backup externo quedaron verificados.

      - name: Report product creation failed
        if: ${{ failure() && steps.request.outputs.operation_id != '' }}
        uses: ./.github/actions/report-portal-event
        with:
          operation-id: ${{ steps.request.outputs.operation_id }}
          product-slug: ${{ steps.request.outputs.product_name }}
          stage: failed
          status: failure
          title: Creación detenida
          summary: Factory no pudo completar una etapa. Consulta el workflow vinculado para ver el motivo.
