name: Create GoodMorning product repository

on:
  pull_request:
    branches:
      - dev
    types:
      - closed
    paths:
      - 'requests/*.json'
  workflow_dispatch:
    inputs:
      product_name:
        description: Repository slug for the new product.
        required: true
        type: string
      description:
        description: Product repository description.
        required: true
        type: string
      confirm_provision:
        description: Confirm that a private product repository should be provisioned.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: create-product-${{ github.event.inputs.product_name || github.sha }}
  cancel-in-progress: false

jobs:
  create-product:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    name: Provision product repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out factory dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve product request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            product_name="${{ github.event.inputs.product_name }}"
            description="${{ github.event.inputs.description }}"
            confirm_provision="${{ github.event.inputs.confirm_provision }}"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            mapfile -t requests < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.merge_commit_sha }}" -- 'requests/*.json')
            if [ "${#requests[@]}" -ne 1 ] || [ ! -f "${requests[0]}" ]; then
              echo "A merged product request PR must add or change exactly one requests/<product>.json file."
              exit 1
            fi
            product_name="$(jq -er '.product_name' "${requests[0]}")"
            description="$(jq -er '.description' "${requests[0]}")"
            confirm_provision="$(jq -r '.confirm_provision // false' "${requests[0]}")"
          else
            mapfile -t requests < <(git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}" -- 'requests/*.json')
            if [ "${#requests[@]}" -ne 1 ] || [ ! -f "${requests[0]}" ]; then
              echo "A product request push must add or change exactly one requests/<product>.json file."
              exit 1
            fi
            product_name="$(jq -er '.product_name' "${requests[0]}")"
            description="$(jq -er '.description' "${requests[0]}")"
            confirm_provision="$(jq -r '.confirm_provision // false' "${requests[0]}")"
          fi
          {
            echo "product_name=${product_name}"
            echo "confirm_provision=${confirm_provision}"
            echo "description<<GOODMORNING_DESCRIPTION"
            echo "${description}"
            echo "GOODMORNING_DESCRIPTION"
          } >> "${GITHUB_OUTPUT}"

      - name: Refuse unconfirmed provisioning
        if: ${{ steps.request.outputs.confirm_provision != 'true' }}
        run: |
          echo "confirm_provision must be true before provisioning." >&2
          exit 1

      - name: Validate product name before requesting token
        run: |
          python3 - <<'PY'
          import re
          import sys
          name = "${{ steps.request.outputs.product_name }}"
          reserved = {"goodmorning-factory", "goodmorning-mvp-template"}
          if not name or len(name) > 63 or name in reserved or not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]*[a-z0-9])?", name):
              print("Invalid product_name. Use lowercase letters, numbers, and hyphens; start/end with a letter or number; avoid reserved names; max 63 characters.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GOODMORNING_FACTORY_APP_ID }}
          private-key: ${{ secrets.GOODMORNING_FACTORY_PRIVATE_KEY }}
          owner: goodmorning-mx

      - name: Provision repository from template
        id: provision
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if python3 scripts/create_product.py \
            --name "${{ steps.request.outputs.product_name }}" \
            --description "${{ steps.request.outputs.description }}" \
            --owner goodmorning-mx \
            --template-owner goodmorning-mx \
            --template-repo goodmorning-mvp-template \
            > provisioning-result.json 2> provisioning-error.json; then
            cat provisioning-result.json
          else
            cat provisioning-error.json >&2
            cp provisioning-error.json provisioning-result.json
            exit 1
          fi

      - name: Register repository-first product manifest
        id: catalog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BACKUP_STORAGE_UUID: ${{ vars.COOLIFY_BACKUP_STORAGE_UUID || 'c1rrntk8wv4cf3tl3wqviwp3' }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          python3 scripts/register_product_manifest.py \
            --product "${{ steps.request.outputs.product_name }}" \
            --backup-storage-uuid "${BACKUP_STORAGE_UUID}" \
            --factory-branch dev \
            > catalog-result.json
          cat catalog-result.json
          echo "manifest_path=$(jq -er '.manifest_path' catalog-result.json)" >> "${GITHUB_OUTPUT}"

      - name: Create deployment verification sentinel
        id: sentinel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[automation] Coolify resources-v2 development reconciliation failed"
          issue_number="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -z "${issue_number}" ]; then
            gh issue create \
              --title "${title}" \
              --body "Verification sentinel for repository-first product \`${{ steps.request.outputs.product_name }}\`. This issue closes only after frontend, API, private PostgreSQL, and Oracle backup verification succeed."
            issue_number="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          fi
          if [ -z "${issue_number}" ]; then
            echo "Unable to create or find the deployment verification issue."
            exit 1
          fi
          echo "issue_number=${issue_number}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch targeted Coolify reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GH_TOKEN}"
          gh workflow run reconcile-product-development.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref dev \
            -f manifest_path="${{ steps.catalog.outputs.manifest_path }}"

      - name: Wait for verified development deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.sentinel.outputs.issue_number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 165); do
            state="$(gh issue view "${ISSUE_NUMBER}" --json state --jq '.state')"
            if [ "${state}" = "CLOSED" ]; then
              echo "Repository-first product deployment verified."
              exit 0
            fi
            failed="$(gh issue view "${ISSUE_NUMBER}" --json comments --jq '[.comments[].body | contains("The automatic Coolify resources-v2 development reconciliation failed.")] | any')"
            if [ "${failed}" = "true" ]; then
              echo "Coolify reconciliation reported a sanitized failure in issue #${ISSUE_NUMBER}."
              exit 1
            fi
            echo "Waiting for Coolify verification (${attempt}/165)..."
            sleep 20
          done
          echo "Timed out waiting for verified Coolify reconciliation."
          exit 1

      - name: Publish provisioning summary
        if: always()
        run: |
          {
            echo "## GoodMorning product provisioning"
            echo
            echo "- Product: \`${{ steps.request.outputs.product_name }}\`"
            echo "- Template: \`goodmorning-mx/goodmorning-mvp-template\`"
            echo "- Owner: \`goodmorning-mx\`"
            echo "- Frontend: https://dev.${{ steps.request.outputs.product_name }}.goodmorning.mx"
            echo "- API: https://api.dev.${{ steps.request.outputs.product_name }}.goodmorning.mx/health"
            echo
            if [ -f provisioning-result.json ]; then
              echo "### Result"
              echo '```json'
              cat provisioning-result.json
              echo '```'
            else
              echo "Provisioning did not produce a result file. Check job logs for the validation or API error."
            fi
            echo
            echo "The workflow never prints token or private-key material."
          } >> "$GITHUB_STEP_SUMMARY"
