name: Deliver eSIM admin credential (encrypted)

on:
  workflow_dispatch:
    inputs:
      recipient_public_key_der_b64:
        description: Base64 encoded DER RSA public key; the artifact contains ciphertext only.
        required: true
        type: string

permissions:
  contents: read

jobs:
  encrypt-credential:
    name: Encrypt eSIM admin credential
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      RECIPIENT_PUBLIC_KEY_DER_B64: ${{ inputs.recipient_public_key_der_b64 }}
      ESIM_BACKEND_APPLICATION_NAME: esim-api-dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch and encrypt the existing bootstrap credential
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          import subprocess
          import urllib.parse
          from pathlib import Path

          from scripts.reconcile_advanced_product import (
              Coolify,
              _field,
              _items,
              _strip_coolify_literal_quotes,
              _uuid,
          )

          root = Path(os.environ["RUNNER_TEMP"]) / "esim-admin-credential"
          root.mkdir(mode=0o700)
          key_path = root / "recipient.der"
          plaintext_path = root / "credential.txt"
          encrypted_path = root / "credential.enc"
          try:
              public_key = base64.b64decode(
                  os.environ["RECIPIENT_PUBLIC_KEY_DER_B64"], validate=True
              )
              key_path.write_bytes(public_key)
              key_path.chmod(0o600)
              subprocess.run(
                  ["openssl", "pkey", "-pubin", "-inform", "DER", "-in", str(key_path), "-noout"],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )

              client = Coolify(
                  os.environ["COOLIFY_BASE_URL"],
                  os.environ["COOLIFY_API_TOKEN"],
                  apply=False,
              )
              try:
                  applications = _items(client.get("/applications"))
                  matches = [
                      entry for entry in applications
                      if _field(entry, "name") == os.environ["ESIM_BACKEND_APPLICATION_NAME"]
                  ]
                  if len(matches) != 1:
                      raise SystemExit("The eSIM API application could not be resolved uniquely.")
                  application_uuid = _uuid(matches[0], "eSIM API application")
                  environments = _items(
                      client.get(
                          "/applications/"
                          + urllib.parse.quote(application_uuid, safe="")
                          + "/envs"
                      )
                  )
              except Exception as exc:
                  raise SystemExit(
                      f"Coolify credential lookup failed ({type(exc).__name__})."
                  ) from None

              item = next(
                  (entry for entry in environments if _field(entry, "key") == "ADMIN_BOOTSTRAP_PASSWORD"),
                  None,
              )
              value = _field(item, "real_value") if item else None
              if not isinstance(value, str) or not value:
                  raise SystemExit("The configured admin credential is unavailable.")
              value = _strip_coolify_literal_quotes(value)
              if not value:
                  raise SystemExit("The configured admin credential is unavailable.")

              descriptor = os.open(plaintext_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, "w", encoding="utf-8") as credential_file:
                  credential_file.write(value)
              subprocess.run(
                  [
                      "openssl", "pkeyutl", "-encrypt", "-pubin", "-keyform", "DER",
                      "-inkey", str(key_path), "-in", str(plaintext_path),
                      "-out", str(encrypted_path), "-pkeyopt", "rsa_padding_mode:oaep",
                      "-pkeyopt", "rsa_oaep_md:sha256",
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              encrypted_path.chmod(0o600)
              print("Admin credential encrypted successfully; no plaintext was logged.")
          finally:
              plaintext_path.unlink(missing_ok=True)
              key_path.unlink(missing_ok=True)
          PY

      - name: Upload encrypted credential for one-time retrieval
        uses: actions/upload-artifact@v4
        with:
          name: esim-admin-credential-ciphertext
          path: ${{ runner.temp }}/esim-admin-credential/credential.enc
          if-no-files-found: error
          retention-days: 1
