# Coolify-safe Docker Compose baseline.
# Public ingress is owned by Coolify/Traefik; never publish service ports to the host here.
services:
  frontend:
    image: ${FRONTEND_IMAGE:-nginx:1.27-alpine}
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:-python:3.12-alpine}
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        import json
        import os

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path == "/health":
                    payload = json.dumps({"status": "ok", "env": os.getenv("APP_ENV", "dev")}).encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(payload)))
                    self.end_headers()
                    self.wfile.write(payload)
                    return
                self.send_response(404)
                self.end_headers()

            def log_message(self, format, *args):
                return

        HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:?set-in-coolify}
      DATABASE_URL: postgresql://${POSTGRES_USER:?set-in-coolify}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:?set-in-coolify}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).read()'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set-in-coolify}
      POSTGRES_USER: ${POSTGRES_USER:?set-in-coolify}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  postgres-data:
